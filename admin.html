<script>
window.addEventListener('load', function () {
  setTimeout(function () {
    if (window.__admReady) return;
    var m = document.getElementById('main');
    if (m && m.querySelector('.loading')) m.innerHTML = '<div class="adm-login"><section class="panel"><h1>Admin could not start</h1><p>Make sure admin.js, common.js, style.css and supabase.js are uploaded next to admin.html, then reload with Ctrl+Shift+R.</p></section></div>';
  }, 9000);
});
</script>
